<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff"><meta name="description" content="Голосования на выбывание для друзей."><meta name="referrer" content="no-referrer">
  <title>Темы для Tavern Gamejam</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">К голосованию</a>
  <header class="header"><a href="./" class="brand">Темы для Tavern Gamejam</a><div class="header-actions"><button class="button" id="admin-open">Организатор</button><button class="button dark" id="join">Войти по коду</button></div></header>
  <div class="page-layout">
    <aside class="sidebar" aria-label="Голосования"><div class="sidebar-heading"><span>Голосования</span><span id="category-count" class="count">0</span></div><nav id="categories" aria-label="Выбор голосования"><span class="muted">Загрузка…</span></nav></aside>
    <main id="main" tabindex="-1">
      <div id="notice" class="notice" hidden></div>
      <div id="admin-tools"></div>
      <section class="tournament" aria-labelledby="tournament-title"><div class="section-top"><h1 id="tournament-title">Загружаем голосования…</h1><div class="section-actions"><span id="tournament-status" class="badge"></span><button class="icon-button" id="refresh" aria-label="Обновить результаты" title="Обновить результаты">↻</button></div></div><div id="summary" class="summary"></div><div id="winner-banner"></div><div id="bracket" class="bracket" aria-label="Турнирная сетка"></div></section>
      <footer><span id="connection">Подключаемся</span><button class="text-button" id="rules">Правила голосования</button></footer>
    </main>
  </div>
  <dialog id="dialog"><div class="dialog-head"><button class="icon-button" id="dialog-close" aria-label="Закрыть окно">×</button></div><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
